<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07121d" />
    <title>Focus Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=cinematic-home-v2" />
  </head>
  <body>
    <main class="dashboard" aria-label="Focus dashboard">
      <div class="background" aria-hidden="true"></div>
      <div class="shade" aria-hidden="true"></div>

      <div class="screen-track" id="screenTrack">
        <section class="screen home-screen" aria-label="Home screen">
          <section class="focus-copy" aria-label="Date and motivation">
            <p class="eyebrow">A focused mind<br />builds an extraordinary life.</p>
            <span class="accent-line"></span>
            <div class="time-row"><time id="time">10:42</time><span id="meridiem">PM</span></div>
            <p class="date" id="date">Sunday, 6 September</p>
            <blockquote>“A focused mind<br />builds an extraordinary life.”</blockquote>
            <span class="accent-line quote-line"></span>
            <p class="values">Focus <i></i> Discipline <i></i> Progress</p>
          </section>

          <aside class="widgets" aria-label="Weather and calendar">
            <section class="glass-card weather-card" aria-label="Weather in New Delhi">
              <div class="weather-title"><span class="pin" aria-hidden="true">⌖</span><span>New Delhi</span><small>Clear Sky</small></div>
              <div class="weather-main">
                <div class="sun" aria-hidden="true"><b></b></div>
                <div><strong>28°C</strong><p>Feels like 30°</p></div>
                <dl><div><dt>H</dt><dd>30°</dd></div><div><dt>L</dt><dd>24°</dd></div><div><dt>AQI</dt><dd>78</dd></div><div><dt>Good</dt><dd class="status-dot"></dd></div></dl>
              </div>
            </section>

            <section class="glass-card calendar-card" aria-label="September 2026 calendar">
              <header><h1 id="monthTitle">September 2026</h1><div class="month-actions"><button type="button" id="previousMonth" aria-label="Previous month">‹</button><button type="button" id="nextMonth" aria-label="Next month">›</button></div></header>
              <div class="calendar-weekdays" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
              <div class="calendar-grid" id="calendarGrid"></div>
            </section>
          </aside>
        </section>

        <section class="screen future-screen" aria-label="Future screen placeholder">
          <p>Next screen</p><span>Ready for the next view.</span>
        </section>
      </div>

      <button class="fullscreen-toggle" id="fullscreenButton" type="button" aria-label="Enter full screen" title="Full screen">⛶</button>
      <div class="screen-pagination" aria-label="Screen navigation"><button class="active" aria-label="Home screen"></button><button aria-label="Next screen"></button></div>
    </main>
    <script src="app.js?v=cinematic-home-v2"></script>
  </body>
</html>
